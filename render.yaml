services:
  - type: web
    name: accessiai
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
